<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc"><title id="title">ÉcoNova — blueprint conceptuel EcoScan</title><desc id="desc">Une ouverture unique alimente une zone de séparation, une chambre de scan et un aiguillage. Trois compartiments intérieurs distincts et une zone de contrôle sont accessibles par maintenance. Une session via l’app attribuerait les EcoPoints après confirmation.</desc><defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#d4e7df" stroke-width=".8"/></pattern><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8" fill="none" stroke="#13a89e" stroke-width="1.5"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#dcefe6}.title{font-size:56px;font-weight:700}.sub{font-size:19px;fill:#9acdb8}.label{font-size:22px;font-weight:700}.small{font-size:17px;fill:#c0ddce}.tiny{font-size:14px;fill:#9acdb8}.outline{fill:none;stroke:#a6d8c0;stroke-width:2.5}.guide{fill:none;stroke:#69b69a;stroke-width:1.5}.flow{fill:none;stroke:#20c8ad;stroke-width:4;marker-end:url(#arrow)}</style></defs><rect width="1600" height="1080" fill="#062e2b"/><rect x="35" y="35" width="1530" height="1010" rx="6" class="outline"/><rect x="36" y="36" width="1528" height="1008" fill="url(#grid)" opacity=".09"/><text x="85" y="112" class="title">ÉcoNova</text><text x="85" y="150" class="sub">CONCEPT ECOSCAN / LE TRI ENTRE DANS UNE NOUVELLE ÈRE</text><text x="1120" y="108" class="small">UNE ENTRÉE. UN TRI INTERNE.</text><text x="1120" y="140" class="tiny">BLUEPRINT DE PRINCIPE / VERSION 01</text><path d="M85 180H1515" class="guide"/>
<rect x="580" y="220" width="440" height="660" rx="45" fill="#0c4239" stroke="#a6d8c0" stroke-width="4"/><rect x="605" y="248" width="390" height="110" rx="15" fill="#082e29" stroke="#a6d8c0" stroke-width="2"/><text x="632" y="285" class="label">ÉcoNova / ECO-001</text><text x="632" y="318" class="small">Session active → dépôt commun</text><rect x="625" y="380" width="350" height="80" rx="24" fill="#031c19" stroke="#c5e5d4" stroke-width="4"/><text x="800" y="426" text-anchor="middle" class="label">ENTRÉE UNIQUE ↓</text><rect x="605" y="490" width="390" height="345" fill="#062e2b" stroke="#82bba0" stroke-width="2" stroke-dasharray="8 6"/><text x="625" y="520" class="tiny">COUPE INTERNE · AGENCEMENT À TESTER</text><rect x="680" y="536" width="240" height="42" rx="8" class="outline"/><path d="M695 570H905" class="guide"/><circle cx="708" cy="568" r="6" class="outline"/><circle cx="730" cy="568" r="6" class="outline"/><circle cx="752" cy="568" r="6" class="outline"/><circle cx="774" cy="568" r="6" class="outline"/><circle cx="796" cy="568" r="6" class="outline"/><circle cx="818" cy="568" r="6" class="outline"/><circle cx="840" cy="568" r="6" class="outline"/><circle cx="862" cy="568" r="6" class="outline"/><circle cx="884" cy="568" r="6" class="outline"/><rect x="718" y="595" width="164" height="45" rx="8" fill="#12584b" stroke="#20c8ad" stroke-width="2"/><text x="800" y="624" text-anchor="middle" class="small">SCAN INTERNE</text><path d="M800 650V677M800 677L670 714M800 677V714M800 677L930 714" class="flow"/><rect x="625" y="725" width="100" height="85" rx="8" class="outline"/><rect x="750" y="725" width="100" height="85" rx="8" class="outline"/><rect x="875" y="725" width="100" height="85" rx="8" class="outline"/><text x="675" y="772" text-anchor="middle" class="small">PET</text><text x="800" y="763" text-anchor="middle" class="small">ALU</text><text x="925" y="772" text-anchor="middle" class="small">PAPIER</text><text x="800" y="861" text-anchor="middle" class="tiny">PORTE TECHNIQUE / COLLECTE SÉPARÉE</text>
<text x="85" y="275" class="label">01 / Session via l’app</text><text x="85" y="309" class="small">QR propre à la station.</text><text x="85" y="336" class="small">Identité temporaire du portefeuille.</text><path d="M420 295H530L605 285" class="guide"/>
<text x="85" y="420" class="label">02 / Dépôt commun</text><text x="85" y="454" class="small">Recyclables acceptés, sans choisir le bac.</text><text x="85" y="481" class="small">Sacs fermés et déchets dangereux exclus.</text><path d="M455 435H555L625 420" class="guide"/>
<text x="85" y="574" class="label">03 / Séparation des objets</text><text x="85" y="608" class="small">Isoler les éléments d’un dépôt mélangé.</text><text x="85" y="635" class="small">Mécanisme et débit à prototyper.</text><path d="M450 591H550L680 555" class="guide"/>
<text x="85" y="733" class="label">04 / Reconnaissance</text><text x="85" y="767" class="small">Capteurs et modèle à développer.</text><text x="85" y="794" class="small">Cible de 5 ms : non démontrée.</text><path d="M425 742H530L718 617" class="guide"/>
<text x="1110" y="425" class="label">05 / Aiguillage interne</text><text x="1110" y="459" class="small">Routage vers la filière adaptée.</text><text x="1110" y="486" class="small">Objet incertain : contrôle isolé.</text><path d="M1110 510L1050 510 1015 680 805 680" class="guide"/>
<text x="1110" y="615" class="label">06 / Confirmation &amp; points</text><text x="1110" y="649" class="small">Un événement unique après dépôt validé.</text><text x="1110" y="676" class="small">Envoi au portefeuille puis fin de session.</text><path d="M1110 695L1050 695 1020 800" class="guide"/>
<rect x="1190" y="730" width="215" height="178" rx="24" fill="#082e29" stroke="#a6d8c0" stroke-width="3"/><rect x="1260" y="741" width="70" height="8" rx="4" fill="#a6d8c0"/><text x="1215" y="780" class="label">APP ECOSCAN</text><text x="1215" y="818" class="small">+ EcoPoints</text><text x="1215" y="854" class="tiny">PORTEFEUILLE ENVISAGÉ</text><text x="1215" y="880" class="tiny">ÉCHANGES HYPOTHÉTIQUES</text><path d="M1040 810H1170" class="flow"/>
<path d="M85 942H1515" class="guide"/><text x="85" y="978" class="small">SCHÉMA DE CONCEPT — PAS UN PLAN DE FABRICATION · AUCUNE DIMENSION VALIDÉE</text><text x="85" y="1008" class="tiny">Tri mécanique, sécurité, nettoyage, gestion des refus et précision des capteurs à valider. Aucun matériel ni service connecté opérationnel.</text></svg>