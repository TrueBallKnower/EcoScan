  <path d="M385 403q0-63 63-63h844q56 0 56 56v454q0 51-51 51H448q-63 0-63-63Z" fill="url(#shell)" stroke="#b5d6c1" stroke-width="3"/>
  <path d="M417 882v18M1317 882v18" stroke="#b5d6c1" stroke-width="14" stroke-linecap="round"/>
  <rect x="636" y="372" width="684" height="487" rx="10" fill="#0b261f" stroke="#547d65" stroke-width="2"/>
  <path d="M655 385h645M655 845h645M1305 385v453" class="detail"/>
  <text x="667" y="411" class="tiny">COUPE EXPLICATIVE / ACCÈS RÉSERVÉ À LA MAINTENANCE</text>

  <!-- The only public inlet. -->
  <path d="M426 432q0-22 22-22h125q24 0 27 24l11 90q3 23-22 23H453q-28 0-30-28Z" fill="#051811" stroke="#8ad9ad" stroke-width="3"/>
  <path d="M445 426v96M447 529h143" stroke="#7dbea0" stroke-width="2"/>
  <path d="M444 426h129l11 84H451Z" fill="#143c2c"/>
  <path d="M459 452h112M459 469h112M459 486h112" stroke="#305941" stroke-width="2"/>
  <rect x="442" y="577" width="112" height="78" rx="8" fill="#09271d" stroke="#64967b"/>
  <text x="498" y="608" class="small" text-anchor="middle">ÉcoNova</text>
  <path d="M460 627h76" stroke="#84edbd" stroke-width="3" stroke-linecap="round"/>
  <!-- QR plaque symbol, deliberately diagrammatic. -->
  <rect x="570" y="574" width="47" height="81" rx="7" fill="#072116" stroke="#64967b"/>
  <g fill="none" stroke="#cce8d7" stroke-width="2"><rect x="578" y="583" width="10" height="10"/><rect x="599" y="583" width="10" height="10"/><rect x="578" y="604" width="10" height="10"/></g>
  <path d="M592 583v9h4v10h10v6h-13v8M582 598h10" fill="none" stroke="#cce8d7" stroke-width="2"/>
  <path d="M581 639h25" stroke="#84edbd" stroke-width="2.5"/>
  <text x="521" y="721" class="label" text-anchor="middle">UNE ENTRÉE</text>
  <text x="521" y="750" class="small" text-anchor="middle">aucun choix de bac</text>
  <text x="521" y="830" class="tiny" text-anchor="middle">ECO-001 / FACE UTILISATEUR</text>

  <!-- Belt, gated singulation and camera chamber. -->
  <path d="M601 513h415q20 0 20 21t-20 21H601" fill="#1c3a2c" stroke="#a6cbb4" stroke-width="2"/>
  <path d="M610 529h406M610 543h406" class="detail"/>
  <g fill="#103323" stroke="#83ad93"><circle cx="645" cy="535" r="10"/><circle cx="712" cy="535" r="10"/><circle cx="779" cy="535" r="10"/><circle cx="846" cy="535" r="10"/><circle cx="913" cy="535" r="10"/><circle cx="980" cy="535" r="10"/></g>
  <path d="M663 449v63M709 449v63" stroke="#bccfbf" stroke-width="5"/>
  <rect x="653" y="440" width="66" height="15" rx="4" fill="#bfd4c5"/>
  <text x="650" y="580" class="tiny">DOSAGE</text><text x="650" y="601" class="tiny">OBJETS ESPACÉS</text>
  <g transform="translate(735 474) rotate(76)" color="#9dc5af"><use href="#can"/></g>
  <rect x="807" y="426" width="212" height="92" rx="5" fill="url(#sensorGlow)" stroke="#6b927c" stroke-width="2"/>
  <path d="M821 432h183" stroke="#b7efcb" stroke-width="4" stroke-linecap="round"/>
  <rect x="884" y="429" width="49" height="23" rx="6" fill="#082319" stroke="#a0c0ac"/>
  <circle cx="908" cy="440" r="7" stroke="#84edbd" fill="#071610" stroke-width="2"/>
  <path d="M901 454 855 511M915 454l48 57" stroke="#82bc98" stroke-width="1.5" stroke-dasharray="4 5"/>
  <g transform="translate(898 469) rotate(75)" color="#dbefdd"><use href="#bottle" transform="scale(.7)"/></g>
  <path d="M755 518h22M947 518h54" class="flow"/>

  <!-- Distribution stage: paths represent alternatives, not simultaneous flows. -->
  <path d="M1039 535v32q0 16 16 16h87" class="flow"/>
  <rect x="1101" y="569" width="83" height="39" rx="6" fill="#285b3d" stroke="#b6dbbd" stroke-width="2"/>
  <circle cx="1142" cy="588" r="9" fill="#8edcaf"/>
  <path d="M1142 608v12" class="outline"/>
  <path d="M1142 620H744v49" class="flow"/>
  <path d="M1142 620H941v49M1142 620v49M1142 620h131v49" class="optional"/>
  <text x="937" y="601" class="tiny" text-anchor="middle">AIGUILLAGE / UN CHEMIN À LA FOIS</text>
  <path d="M672 638h589" class="detail"/>

  <!-- Collection drawers, each isolated with fill sensor. -->
  <g>
    <rect x="663" y="675" width="165" height="163" rx="6" fill="#15433e" stroke="#90cfb0" stroke-width="2"/>
    <path d="M675 690h141M684 796h120" stroke="#589984" stroke-width="2"/>
    <rect x="714" y="687" width="64" height="7" rx="3" fill="#82bb9d"/>
    <g transform="translate(710 719)" color="#b9e4ce"><use href="#bottle"/></g>
