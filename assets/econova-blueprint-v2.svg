    <circle cx="684" cy="710" r="4" fill="#84edbd"/>
    <rect x="858" y="675" width="165" height="163" rx="6" fill="#294933" stroke="#9cbdaa" stroke-width="2"/>
    <path d="M870 690h141M879 796h120" stroke="#6a946f" stroke-width="2"/>
    <rect x="908" y="687" width="64" height="7" rx="3" fill="#82bb9d"/>
    <g transform="translate(925 732)" color="#c2e1c8"><use href="#can"/></g>
    <text x="940" y="817" class="binlabel" text-anchor="middle">ALUMINIUM</text>
    <circle cx="879" cy="710" r="4" fill="#84edbd"/>
    <rect x="1053" y="675" width="165" height="163" rx="6" fill="#4a4533" stroke="#c7bf9b" stroke-width="2"/>
    <path d="M1065 690h141M1074 796h120" stroke="#9a9271" stroke-width="2"/>
    <rect x="1104" y="687" width="64" height="7" rx="3" fill="#c7bf9b"/>
    <g transform="translate(1117 729)" color="#e5dfb6"><use href="#paper"/></g>
    <text x="1135" y="817" class="binlabel" text-anchor="middle">PAPIER SEC</text>
    <circle cx="1074" cy="710" r="4" fill="#84edbd"/>
    <rect x="1246" y="675" width="60" height="163" rx="6" fill="#27372f" stroke="#a2b4a4" stroke-width="2"/>
    <path d="M1254 690h44" stroke="#a2b4a4" stroke-width="3"/>
    <text x="1276" y="764" font-size="40" font-weight="700" text-anchor="middle">?</text>
    <text x="1276" y="818" class="tiny" text-anchor="middle">ISOLÉ</text>
    <circle cx="1258" cy="710" r="4" fill="#d4cf98"/>
  </g>

  <!-- Calls, separated into useful engineering questions. -->
  <g>
    <circle cx="101" cy="361" r="21" fill="#244637" stroke="#75bd99"/><text x="101" y="368" class="number" text-anchor="middle">01</text>
    <text x="78" y="413" class="label">Dépôt commun</text>
    <text x="78" y="445" class="body">Volet protégé.</text><text x="78" y="474" class="body">Interverrouillage prévu.</text>
    <path d="M80 491h217l113 3" class="guide"/><circle cx="420" cy="494" r="4" fill="#9edcba"/>
    <circle cx="101" cy="584" r="21" fill="#244637" stroke="#75bd99"/><text x="101" y="591" class="number" text-anchor="middle">02</text>
    <text x="78" y="636" class="label">Séparer avant</text><text x="78" y="665" class="label">de reconnaître.</text>
    <text x="78" y="699" class="body">Un objet à la fois.</text><text x="78" y="728" class="body">Blocages à détecter.</text>
    <path d="M80 747h215l35-170h305" class="guide"/><circle cx="639" cy="577" r="4" fill="#9edcba"/>
    <circle cx="1475" cy="355" r="21" fill="#244637" stroke="#75bd99"/><text x="1475" y="362" class="number" text-anchor="middle">03</text>
    <text x="1452" y="406" class="label">Chambre de scan</text>
    <text x="1452" y="438" class="body">Caméra + lumière.</text><text x="1452" y="467" class="body">Capteurs à comparer.</text>
    <path d="M1690 488h-259l-51-174H995v109" class="guide"/><circle cx="995" cy="426" r="4" fill="#9edcba"/>
    <circle cx="1475" cy="583" r="21" fill="#244637" stroke="#75bd99"/><text x="1475" y="590" class="number" text-anchor="middle">04</text>
    <text x="1452" y="634" class="label">Routage interne</text>
    <text x="1452" y="667" class="body">Filière acceptée → bac.</text><text x="1452" y="696" class="body">Doute → contrôle isolé.</text>
    <path d="M1690 716h-275l-33-115h-192" class="guide"/><circle cx="1188" cy="601" r="4" fill="#9edcba"/>
  </g>

  <!-- Maintenance indicators and separate digital trace. -->
  <path d="M367 870h997" stroke="#82bc98" stroke-width="1.3" stroke-dasharray="5 7"/>
  <text x="868" y="883" text-anchor="middle" class="tiny">PORTE DE SERVICE VERROUILLABLE / BACS AMOVIBLES / NETTOYAGE / CAPTEURS DE NIVEAU ENVISAGÉS</text>
  <path d="M594 658v278h607" stroke="#779c86" stroke-width="2" stroke-dasharray="4 7" marker-end="url(#guideHead)" fill="none"/>
  <rect x="769" y="915" width="440" height="44" rx="22" fill="#18382b" stroke="#719780"/>
  <text x="989" y="943" class="small" text-anchor="middle">QR → session → dépôt validé → points</text>
  <text x="1261" y="943" class="tiny">FLUX NUMÉRIQUE ENVISAGÉ</text>

  <path d="M78 984H1684" class="detail"/>
  <text x="79" y="1028" class="eyebrow">CE QUI DEVRA ÊTRE PROUVÉ AU PROTOTYPE</text>
  <text x="79" y="1070" class="note">01  Séparation des mélanges</text><text x="526" y="1070" class="note">02  Précision et gestion du doute</text><text x="1083" y="1070" class="note">03  Sécurité et qualité des filières</text>
  <text x="79" y="1120" class="small">Schéma de concept, sans cotes ni performance garantie. Dépôts admis, matériaux, mécanismes et conformité à valider.</text>
  <text x="1684" y="1120" class="small" text-anchor="end">ECOSCAN / 2026</text>
</svg>
