<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 1180" role="img" aria-labelledby="title desc">
  <title id="title">ÉcoNova ECO-001 — architecture conceptuelle</title>
  <desc id="desc">Plan de principe en coupe d’une station à entrée unique. Un volet isole le dépôt, un convoyeur sépare les objets, une chambre éclairée les présente aux capteurs, puis un aiguillage les dirige vers les bacs PET, aluminium, papier ou contrôle isolé. Les bacs sont accessibles par une porte de service verrouillable. La session QR serait reliée à une validation de dépôt avant attribution de points. Aucune dimension ni performance n’est validée.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#9acbb6" stroke-width=".5" opacity=".15"/></pattern>
    <pattern id="majorGrid" width="140" height="140" patternUnits="userSpaceOnUse"><rect width="140" height="140" fill="url(#grid)"/><path d="M140 0H0V140" fill="none" stroke="#9acbb6" stroke-width=".7" opacity=".12"/></pattern>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#285344"/><stop offset="1" stop-color="#102f29"/></linearGradient>
    <linearGradient id="sensorGlow" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#80ffd1" stop-opacity=".15"/><stop offset="1" stop-color="#80ffd1" stop-opacity="0"/></linearGradient>
    <marker id="flowHead" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 7 4.5 1 8" fill="none" stroke="#84edbd" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="guideHead" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 7 4.5 1 8" fill="none" stroke="#81a99a" stroke-width="1.4"/></marker>
    <g id="bottle"><path d="M11 0h14v8l5 10v41q0 7-7 7H12q-7 0-7-7V18l6-10Z" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M9 23h17M9 47h17M11 4h14" fill="none" stroke="currentColor" stroke-width="1.6"/></g>
    <g id="can"><rect x="2" y="0" width="26" height="43" rx="6" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M4 6h22M4 37h22M11 3h8" stroke="currentColor" stroke-width="1.5"/></g>
    <g id="paper"><path d="M4 0h29v39H4Z" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M10 10h17M10 17h17M10 24h12M0 5v40h28" fill="none" stroke="currentColor" stroke-width="1.5"/></g>
    <style>
      text{font-family:Inter,Arial,Helvetica,sans-serif;fill:#eaf5ed}.title{font-size:72px;font-weight:700;letter-spacing:-3px}.eyebrow{font-size:17px;font-weight:700;letter-spacing:2.5px;fill:#83bc9f}.body{font-size:20px;fill:#b8d5c6}.small{font-size:17px;fill:#92b8a5}.label{font-size:24px;font-weight:700;letter-spacing:-.4px}.tiny{font-size:15px;fill:#92b8a5}.outline{fill:none;stroke:#bddfc9;stroke-width:2}.detail{fill:none;stroke:#71988a;stroke-width:1.5}.guide{fill:none;stroke:#8abcaa;stroke-width:1.7}.flow{fill:none;stroke:#84edbd;stroke-width:3.5;marker-end:url(#flowHead)}.optional{fill:none;stroke:#81a99a;stroke-width:2;stroke-dasharray:7 8;marker-end:url(#guideHead)}.number{fill:#84edbd;font-size:20px;font-weight:700}.binlabel{font-size:21px;font-weight:700}.note{font-size:19px;fill:#c5decd}
    </style>
  </defs>
  <rect width="1760" height="1180" rx="8" fill="#09261f"/>
  <rect x="25" y="25" width="1710" height="1130" rx="8" fill="url(#majorGrid)" stroke="#49715e"/>
  <text x="76" y="82" class="eyebrow">ECOSCAN / ÉCONOVA ECO-001</text>
  <text x="74" y="161" class="title" style="font-size:63px">Un seul geste. Un nouveau cycle.</text>
  <text x="79" y="201" class="body">Une entrée pour vous. Quatre voies internes pour les matières.</text>
  <rect x="1360" y="60" width="330" height="88" rx="9" fill="#15382e" stroke="#507560"/>
  <circle cx="1384" cy="87" r="5" fill="#84edbd"/><text x="1400" y="93" class="eyebrow" style="font-size:14px;letter-spacing:1px">ARCHITECTURE CONCEPTUELLE</text>
  <text x="1385" y="124" class="small">Révision 02 · ni plans ni cotes validés</text>
  <path d="M78 234H1684" class="detail"/>

  <text x="78" y="290" class="eyebrow">COUPE EXPLICATIVE / IMPLANTATION ILLUSTRATIVE</text>
  <text x="1680" y="290" class="small" text-anchor="end">Flux matière : continu  /  options mécaniques : pointillé</text>

